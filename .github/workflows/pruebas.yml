name: Pruebas

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: pytest -v
        run: pytest -v

  instalacion-segun-readme:
    # Sigue la sección Instalación y Cómo ejecutar del README, tal cual, en una máquina limpia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalación (README)
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
      - name: Cómo ejecutar (README)
        run: |
          source .venv/bin/activate
          python main.py evaluar
          python main.py alertar datos/ejemplo_semana3.csv
          python main.py auditar
          pytest -v
